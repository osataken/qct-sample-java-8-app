type: specs.openrewrite.org/v1beta/recipe
name: com.amazonaws.java.spring.boot4.UpgradeSpringBoot_4_0
displayName: Migrate to Spring Boot 4.0 (latest major - opt-in)
description: >-
  Migrate applications to Spring Boot 4.0 (community edition). This delegates to the official
  cumulative recipe UpgradeSpringBoot_4_0, which first lands the app on Spring Boot 3.5, then
  upgrades to Spring Framework 7.0, Spring Security 7.0, Spring Batch 6.0, Hibernate 7.1,
  springdoc 3.0, and testcontainers 2.x. NOTE: Spring Boot 4.0 introduces structural breaking
  changes - modular starters, the spring-boot-starter-web -> spring-boot-starter-webmvc rename,
  oauth2 starter renames, and AOP starter changes - that frequently require manual follow-up by
  the Kiro CLI. See migration-knowledge/java/19-spring-boot-latest-migration.md. This recipe is
  OPT-IN and is not the default pipeline target. Requires rewrite-spring 6.33.0 or newer.
tags:
  - spring
  - boot
recipeList:
  - org.openrewrite.java.spring.boot4.UpgradeSpringBoot_4_0
