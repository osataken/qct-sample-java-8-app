displayName: Migrate to the latest stable Spring Boot (3.5)
description: >-
  Migrate applications to the latest stable Spring Boot 3.5 release. This delegates to the
  official, cumulative OpenRewrite recipe UpgradeSpringBoot_3_5, which chains the full path
  from Spring Boot 2.x through 2.7, 3.0, 3.1, 3.2, 3.3, 3.4 and on to 3.5 - including the
  Jakarta namespace migration, Spring Framework 6.2, Spring Security 6, Spring Data, Spring
  Cloud, Spring Kafka, Hibernate 6, springdoc, build-file and plugin updates, and per-version
