type: specs.openrewrite.org/v1beta/recipe
name: com.amazonaws.java.spring.boot2.UpgradeSpringBoot_2_7
displayName: Migrate to Spring Boot 2.7 (javax, Java 17 baseline)
description: >-
  Migrate applications to Spring Boot 2.7.x, which is managed by Spring Framework 5.3.x and
  stays on the javax namespace. This delegates to the official cumulative recipe
  UpgradeSpringBoot_2_7, which chains the path up through 2.7 (dependency/property migrations
  and deprecated-API changes) WITHOUT performing the javax-to-jakarta migration. Spring 5.3
  bundles an ASM/CGLIB that can verify Java 17 (class file v61) bytecode, so this is the
  namespace-safe Spring target for a Java 17 upgrade that must remain on javax. It is NOT the
  default pipeline target and is only valid paired with a Java 17 target.
tags:
  - spring
  - boot
recipeList:
  - org.openrewrite.java.spring.boot2.UpgradeSpringBoot_2_7
---
type: specs.openrewrite.org/v1beta/recipe
name: com.amazonaws.java.spring.framework.UpgradeSpringFramework_5_3
displayName: Migrate plain Spring Framework to 5.3 (javax, non-Boot)
description: >-
  Upgrade non-Spring-Boot applications to Spring Framework 5.3.x, which supports Java 17
  (class file v61) bytecode while staying on the javax namespace. Delegates to the official
  cumulative recipe org.openrewrite.java.spring.framework.UpgradeSpringFramework_5_3, which
  chains 5.0/5.1/5.2 -> 5.3, bumps org.springframework and org.springframework.security
  artifacts to 5.3.x, and removes standalone cglib. It does NOT perform the javax-to-jakarta
  migration, so it is the namespace-safe Spring target for a non-Boot Java 17 upgrade that must
  remain on javax. Intended for the javax / Java 17 track (springBootTargetVersion=2.7) only;
  Spring Boot projects use the UpgradeSpringBoot_2_7 recipe instead.
tags:
  - spring
  - framework
recipeList:
  # Move the (often property-/BOM-managed) Spring Framework version to 5.3.x
  # FIRST. The official UpgradeSpringFramework_5_3 recipe bumps literal dependency
  # versions but does not reliably rewrite a custom version property such as
  # <org.springframework.version>. When that property is left behind, the app
  # stays on its old Spring while the code is retargeted to Java 17, and old
  # Spring's bundled ASM crashes at startup reading Java 17 (v61) class files.
  # UpgradeDependencyVersion with a glob artifactId + overrideManagedVersion
  # moves the managed/property version so the upgrade actually takes effect.
  # (Scoped to the non-Boot javax/5.3 path only; Boot composites are unchanged.)
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework
      artifactId: "*"
      newVersion: 5.3.39
      overrideManagedVersion: true
  # Move the REST of the javax-compatible Spring stack in lockstep so the classpath
  # is never left split (framework on 5.3 while Security/WS stay on 3.x/4.x -> the
  # runtime incompatibility the customer hit in iteration-25, where only the
  # framework advanced and Spring Security/WS were left behind). These are the last
  # javax (pre-jakarta) lines that pair with Spring Framework 5.3, and are the exact
  # versions validated on a large multi-module javax estate: Spring Security 5.7.14
  # and Spring WS 3.1.3. This only PINS the versions so the whole stack is coherent;
  # Kiro's build-fix leg still performs the Spring Security 3.x/4.x -> 5.x
  # *code/config* migration (WebSecurityConfigurerAdapter, XML namespaces, removed
  # APIs, etc. - see doc 28). spring-jms is part of org.springframework:* above.
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework.security
      artifactId: "*"
      newVersion: 5.7.14
      overrideManagedVersion: true
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework.ws
      artifactId: "*"
      newVersion: 3.1.3
      overrideManagedVersion: true
  # Literal versions (not a dynamic "5.3.x" selector) are deliberate: resolving
  # "latest 5.3.x" requires a Maven-metadata lookup that silently no-ops in a
  # restricted/offline customer build, leaving the version unmoved - the exact
  # failure mode in iteration-25 (the recipe "ran" but the property never changed,
  # so Kiro had to hard-pin 5.3.39 by hand). Bump these patch literals when a newer
  # 5.3.x / 5.7.x / 3.1.x is desired.
  #
  # overrideManagedVersion adds an explicit <version> on modules that DECLARE the
  # dependency (incl. a hard-coded literal such as a stray spring 3.1.1.RELEASE),
  # but it does NOT rewrite a shared version *property* left in a parent POM, so
  # modules that only inherit the parent default stay behind (the MockServices /
  # pom-parent.xml 3.2.9 leftover in iteration-25). Rewrite the common Spring
  # version properties directly too. ChangePropertyValue is a no-op when the key is
  # absent (addIfMissing=false), so this is safe for projects that do not use these
  # property names. Scoped to the non-Boot javax/5.3 composite only; the Boot
  # composites are unchanged.
  - org.openrewrite.maven.ChangePropertyValue:
      key: org.springframework.version
      newValue: 5.3.39
      addIfMissing: false
  - org.openrewrite.maven.ChangePropertyValue:
      key: org.springframework.security.version
      newValue: 5.7.14
      addIfMissing: false
  - org.openrewrite.maven.ChangePropertyValue:
      key: spring.ws.version
      newValue: 3.1.3
      addIfMissing: false
  - org.openrewrite.maven.ChangePropertyValue:
      key: spring.jms.version
      newValue: 5.3.39
      addIfMissing: false
  # Deterministic backstop for the out-of-reactor parent-POM case: when the Spring
  # version is governed by a parent POM that is NOT a reactor module, neither
  # UpgradeDependencyVersion nor ChangePropertyValue above can reach it (proven on
  # the customer estate: 0 pom edits, version stuck < 5.3). AddDependency with
  # overrideManagedVersion writes an EXPLICIT version onto the module POMs that
  # actually use Spring, which DOES move the effective version. Kept bounded so it
  # is not over-dramatic: onlyIfUsing means only modules already using the package
  # are touched (no Spring deps injected into unrelated modules), and versions match
  # the stack pinned above. Validated pattern - see doc 29.
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.springframework
      artifactId: spring-core
      version: 5.3.39
      onlyIfUsing: org.springframework..*
      overrideManagedVersion: true
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.springframework
      artifactId: spring-web
      version: 5.3.39
      onlyIfUsing: org.springframework.web..*
      overrideManagedVersion: true
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.springframework.security
      artifactId: spring-security-web
      version: 5.7.14
      onlyIfUsing: org.springframework.security..*
      overrideManagedVersion: true
  # Bean Validation API alignment. The official recipe migrates @NotEmpty/@NotBlank
  # to the Bean Validation 2.0 package (javax.validation.constraints.*), which only
  # exists in validation-api 2.0+. Legacy apps commonly carry validation-api 1.x
  # (often transitively via an old hibernate-validator), so the migrated code fails
  # to compile ("cannot find symbol NotEmpty"). Align the API to the last javax
  # (pre-jakarta) Bean Validation line so the migrated constraints resolve.
  # overrideManagedVersion covers managed/parent-pinned versions; this is a no-op
  # when the project does not use javax.validation. (The hibernate-validator
  # IMPLEMENTATION bump - which also changes groupId, 4.x org.hibernate -> 6.x
  # org.hibernate.validator - is a runtime/config concern left to the Kiro build-fix
  # leg; see doc 28.)
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: javax.validation
      artifactId: validation-api
      newVersion: 2.0.1.Final
      overrideManagedVersion: true
  - org.openrewrite.java.spring.framework.UpgradeSpringFramework_5_3
---
